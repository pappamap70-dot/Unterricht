<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maus-Training – Klasse 5</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bd:#6B1A2A;--bd2:#4F111D;--tc:#C0603A;--ls:#E8906A;--cr:#FBF5F0;--ink:#2B1A1E;--teal:#1F7A6D;--gold:#E3A72F;--ok:#2E7D32;--bad:#B3261E;--line:#E8D5C8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cr);color:var(--ink);font-family:'Barlow Condensed','Arial Narrow','Roboto Condensed',Arial,sans-serif;font-size:21px;line-height:1.3}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
h1{font-size:40px;margin:.1em 0 .3em;color:var(--bd)}
h2{font-size:30px;margin:.2em 0 .4em;color:var(--bd)}
p{margin:.4em 0}

/* Kopfzeile */
header#top{background:var(--bd);color:var(--cr);display:flex;align-items:center;gap:16px;padding:8px 20px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.brand{font-weight:700;font-size:30px;letter-spacing:.5px;display:flex;gap:10px;align-items:center;margin-right:10px}
header nav{display:flex;gap:6px;flex:1}
header nav button{background:transparent;color:var(--cr);border:0;border-bottom:4px solid transparent;padding:6px 14px;font-size:24px;font-weight:600}
header nav button:hover{border-bottom-color:var(--ls)}
header nav button.on{border-bottom-color:var(--tc);background:rgba(255,255,255,.1)}
.who{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 16px;font-size:22px;cursor:pointer}
.who:hover{background:rgba(255,255,255,.26)}
main{max-width:1120px;margin:0 auto;padding:18px}

/* Bausteine */
.btn{background:var(--bd);color:var(--cr);border:0;border-radius:14px;padding:12px 28px;font-weight:700;font-size:25px;box-shadow:0 4px 0 var(--bd2)}
.btn:hover{background:#7d2133}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd2)}
.btn.tc{background:var(--tc);box-shadow:0 4px 0 #8f4326}.btn.tc:hover{background:#cf6d46}
.btn.ghost{background:transparent;color:var(--bd);border:3px solid var(--bd);box-shadow:none}
.btn.ghost:hover{background:#f3e4da}
.btn.sm{font-size:19px;padding:6px 16px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:3px solid var(--line);border-radius:20px;padding:22px 26px;margin-bottom:18px}
.card.center{text-align:center}
.merk{background:#FFF1E8;border-left:8px solid var(--tc);border-radius:10px;padding:10px 18px;margin:14px 0 20px;font-size:24px}
.merk p{margin:.5em 0}
.big{font-size:70px;line-height:1}
.row-btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.center .row-btns{justify-content:center}
input[type=text],input[type=password],select{border:3px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;font-size:24px}
input[type=text]:focus,input[type=password]:focus,select:focus,textarea:focus{outline:0;border-color:var(--tc)}
textarea{width:100%;border:3px solid var(--line);border-radius:12px;padding:10px;font-size:18px;font-family:Consolas,monospace;min-height:90px}
label{display:block;font-weight:600;margin:10px 0 4px;color:var(--bd)}
.muted{color:#7a6a64;font-size:19px}

/* Übersicht */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.st{background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px 12px;text-align:center;cursor:pointer;transition:.15s}
.st:hover{border-color:var(--tc);transform:translateY(-3px);box-shadow:0 6px 14px #0002}
.st .ic{font-size:50px}.st h3{margin:.1em 0 .2em;color:var(--bd);font-size:27px}
.st .nr{color:var(--tc);font-weight:700;font-size:18px}
.stars{font-size:30px;color:var(--gold);letter-spacing:3px}.stars .off{color:#dccdc2}
.prog{height:18px;background:#ead9cd;border-radius:10px;overflow:hidden;margin:6px 0 16px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--tc),var(--bd))}
.chal{display:flex;gap:20px;align-items:center;background:linear-gradient(120deg,var(--bd),#8a2a3d);color:var(--cr);border-radius:20px;padding:22px 28px;margin-top:22px}
.chal.lock{background:#a99b94}
.chal .big{font-size:76px}.chal h2{color:var(--cr);margin:0}
.crumb{margin-bottom:12px}
.foot{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Spielfeld */
.gbar{display:flex;gap:22px;align-items:center;justify-content:space-between;background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 18px;font-size:25px;margin-bottom:10px}
.gbar b{color:var(--bd)}
.task{font-size:26px;font-weight:600;margin:6px 2px 10px;color:var(--bd);min-height:34px}
.tbar{height:16px;background:#ead9cd;border-radius:8px;margin-bottom:10px;overflow:hidden}.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--tc),var(--bd))}
.awrap{position:relative}
.arena{position:relative;background:#fff;border:4px solid var(--bd);border-radius:18px;height:min(60vh,500px);min-height:380px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.arena.miss{border-color:#d33;animation:shake .26s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.banner{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:rgba(107,26,42,.96);color:var(--cr);padding:20px}
.banner h2{margin:0;font-size:46px;color:var(--cr)}.banner p{margin:4px 0 14px;font-size:27px;max-width:740px}.banner .bi{font-size:76px;line-height:1}
.banner .pts{font-size:92px;font-weight:700;color:var(--ls);line-height:1}
.banner .sub{font-size:26px;opacity:.95}
.tgt{position:absolute;border-radius:50%;cursor:pointer;background:radial-gradient(circle,#FBF5F0 0 14%,#C0603A 15% 38%,#FBF5F0 39% 56%,#6B1A2A 57%);box-shadow:0 3px 8px #0003}
.file{position:absolute;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid var(--bd);border-radius:14px;cursor:pointer;box-shadow:0 3px 8px #0003;line-height:1}
.file.half{background:#ffe3d3;border-color:var(--tc)}
.lr{position:absolute;border-radius:50%;cursor:pointer;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;text-transform:uppercase;box-shadow:0 3px 8px #0003;border:4px solid #fff}
.lr.L{background:var(--teal)}.lr.R{background:var(--tc)}
.lr.bad{animation:shake .26s}
.legend{position:absolute;top:8px;left:0;right:0;text-align:center;font-weight:600;font-size:22px;pointer-events:none;color:var(--bd)}
.legend .dot{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:-3px;margin:0 6px 0 16px}.dot.L{background:var(--teal)}.dot.R{background:var(--tc)}
.pop{position:absolute;z-index:9;font-size:34px;pointer-events:none;transform:translate(-50%,-50%);animation:popup .5s ease-out forwards}
@keyframes popup{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-50px}}
.hostbar{position:absolute;top:8px;left:12px;right:12px;font-weight:600;font-size:23px;color:var(--bd);pointer-events:none;text-align:center;z-index:3}
.ctx{position:absolute;background:#fff;border:2px solid #9a9a9a;border-radius:6px;box-shadow:0 6px 16px #0004;min-width:180px;z-index:20;padding:4px 0;font-family:Arial,sans-serif}
.ctx div{padding:7px 18px;font-size:19px;cursor:pointer}.ctx div:hover{background:#cfe3ff}
.dcard{position:absolute;width:68px;height:68px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;cursor:grab;box-shadow:0 3px 8px #0004;touch-action:none;z-index:5;border:3px solid #fff}
.dcard.drag{cursor:grabbing;z-index:15;box-shadow:0 10px 20px #0005}
.dcard.back{transition:left .25s,top .25s}
.basket{position:absolute;bottom:10px;height:100px;border:5px dashed;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;background:#fff}
.scr-task{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;padding:0 18px;font-weight:600;font-size:23px;color:var(--bd);background:var(--cr);border-bottom:2px solid var(--line);z-index:2}
.scrollbox{position:absolute;top:48px;left:0;right:0;bottom:0;overflow-y:scroll;background:#fff}
.srow{height:46px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #f0e3da;font-size:24px;cursor:pointer}
.srow:nth-child(even){background:#fcf7f3}
.srow .btn{font-size:20px;padding:6px 18px}
.sitem{position:absolute;width:40px;height:40px;line-height:40px;text-align:center;font-size:28px;border-radius:8px;pointer-events:none}
.sitem.on{outline:3px solid var(--tc);background:#ffe3d3}
.srect{position:absolute;border:2px dashed var(--bd);background:rgba(192,96,58,.15);pointer-events:none;z-index:4}
.quiz{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px 18px}
.quiz h2{margin:6px 0 14px;text-align:center;font-size:36px}
.tiles{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:14px;color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;gap:14px;padding:10px 20px;text-align:left;line-height:1.15}
.tile .sh{font-size:36px;opacity:.9;width:40px;text-align:center}
.tile.a{background:var(--bd)}.tile.b{background:var(--tc)}.tile.c{background:#8A6A1F}.tile.d{background:#3E5C76}
.tile.right{outline:7px solid var(--ok);outline-offset:-4px}.tile.wrong{opacity:.35}

/* Ergebnis */
.resbox{background:var(--cr);border:3px dashed var(--tc);border-radius:12px;padding:10px;word-break:break-all;font-family:Consolas,monospace;font-size:17px;text-align:left;user-select:all}
.spark{display:inline-flex;gap:3px;align-items:flex-end;height:30px}.spark i{width:8px;background:var(--tc);display:block;border-radius:2px;min-height:2px}
table.rank{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:22px}
table.rank th{background:var(--bd);color:var(--cr);padding:8px 12px;text-align:left}
table.rank td{padding:7px 12px;border-bottom:1px solid var(--line)}
table.rank td.num,table.rank th.num{text-align:right}table.rank td.num{font-weight:700}
.msg{margin:8px 0;font-weight:600}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.cols{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}}

/* Beamer / Siegerehrung */
.overlay{position:fixed;inset:0;z-index:100;background:var(--bd);color:var(--cr);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.overlay .codebig{font-size:min(22vw,260px);font-weight:700;letter-spacing:6px;line-height:1;color:var(--ls)}
.pod{display:flex;align-items:flex-end;gap:16px;height:46vh;margin:20px 0}
.pc{width:min(26vw,280px);background:var(--tc);border-radius:16px 16px 0 0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:12px;color:#fff;transition:height .6s}
.pc.p1{height:100%;background:var(--gold);color:var(--bd2)}.pc.p2{height:72%;background:#b9b3b0;color:var(--bd2)}.pc.p3{height:52%}
.pc .pl{font-size:60px;font-weight:700;line-height:1}.pc .nm{font-size:34px;font-weight:700;opacity:0;transition:opacity .5s;word-break:break-word;padding:0 8px}.pc .pt{font-size:28px;opacity:0;transition:opacity .5s .2s}
.pc.show .nm,.pc.show .pt{opacity:1}
canvas.confetti{position:fixed;inset:0;z-index:120;pointer-events:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bd2);color:#fff;padding:10px 22px;border-radius:999px;z-index:200;font-size:22px;box-shadow:0 6px 18px #0005}

/* Live / Beamer */
.hostbig{font-size:34px;margin:.3em 0}
.pinbig{font-size:min(13vw,140px);font-weight:700;letter-spacing:8px;color:var(--bd);line-height:1.1}
.hgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
@media(max-width:900px){.hgrid{grid-template-columns:1fr}}
.pchip{display:inline-block;background:var(--cr);border:2px solid var(--line);border-radius:999px;padding:4px 16px;margin:4px;font-size:26px;font-weight:600;color:var(--bd)}
.brow{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 18px;margin:8px 0;font-size:32px}
.brow .rk{width:56px;font-weight:700;color:var(--tc)}.brow .nm{flex:1;font-weight:600;color:var(--bd)}.brow .dl{color:var(--ok);font-weight:700;min-width:130px;text-align:right}.brow .sc{font-weight:700;min-width:130px;text-align:right}
.bigtimer{font-size:min(15vw,160px);font-weight:700;color:var(--tc);line-height:1;margin:.2em 0}
.linkbig{font-size:min(6vw,66px);font-weight:700;color:var(--bd);word-break:break-all;line-height:1.1;margin:.2em 0 .5em}
.qrbox{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line);line-height:0;display:inline-block}
.qrbox canvas{display:block}
</style>
</head>
<body>
<header id="top">
  <div class="brand"><span>🖱️</span><span>Maus-Training</span></div>
  <nav>
    <button data-v="home">Übungen</button>
  </nav>
  <div class="who" id="who" title="Spieler wechseln"></div>
</header>
<main id="view"></main>
<input type="file" id="fileProg" accept=".json" style="display:none">
<script>
'use strict';
/* ============ Einstellungen ============ */
const LEHRER_PIN = 'bvo5';           // PIN für den Lehrkraft-Bereich (hier änderbar)
const LS_KEY = 'mausTraining.v1';
const LS_T = 'mausTraining.lehrkraft.v1';
const SALT = 'bvo-maus-5';

/* ============ Helfer ============ */
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v || d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
function toast(t) { const d = el('div', 'toast', esc(t)); document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function download(name, text, type) {
  const b = new Blob([text], { type: type || 'application/json' });
  const u = URL.createObjectURL(b); const a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 500);
}
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) { return navigator.clipboard.writeText(t).then(() => true).catch(() => fbCopy(t)); }
  return Promise.resolve(fbCopy(t));
}
function fbCopy(t) {
  const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';
  document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { } a.remove(); return ok;
}
const safeName = s => String(s).trim().replace(/[^\wäöüÄÖÜß-]+/g, '_').slice(0, 24) || 'x';

/* Zufall (mit Startwert, damit alle in der Challenge dieselbe Runde bekommen) */
function hashStr(s) { let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seeded = s => mulberry32(hashStr(s));
const randRng = () => mulberry32((Math.random() * 4294967296) >>> 0);
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
function shuffle(r, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ============ Daten ============ */
let DB = lsGet(LS_KEY, { players: {}, last: null });
if (!DB.players) DB = { players: {}, last: null };
const saveDB = () => lsSet(LS_KEY, DB);
const pkey = (n, k) => n.trim().toLowerCase() + '|' + k.trim().toLowerCase();
const me = () => DB.last && DB.players[DB.last];

/* ============ Ergebnis-Code (für die Lehrkraft) ============ */
function chk(s) { let h = 5381; const t = SALT + s; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0; return h.toString(36).toUpperCase().padStart(6, '0').slice(-6); }
function b64e(s) { const b = new TextEncoder().encode(s); let bin = ''; b.forEach(x => bin += String.fromCharCode(x)); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64d(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function makeCode(r) {
  const body = [r.n, r.k, r.c, r.t, r.s.join(',')].map(x => String(x).replace(/\|/g, '/')).join('|');
  return 'MM1-' + b64e(body) + '-' + chk(body);
}
function readCode(code) {
  const m = /^MM1-([A-Za-z0-9_-]+)-([0-9A-Z]{6})$/.exec(String(code).trim());
  if (!m) return null;
  let body; try { body = b64d(m[1]); } catch (e) { return null; }
  if (chk(body) !== m[2]) return { bad: true };
  const p = body.split('|'); if (p.length < 5) return null;
  const r = { n: p[0], k: p[1], c: p[2], t: +p[3], s: p[4].split(',').map(Number) };
  if (r.s.some(isNaN) || r.s.reduce((a, b) => a + b, 0) !== r.t) return { bad: true };
  return r;
}

/* ============ Navigation ============ */
const view = $('#view');
let cleanup = null, curNav = 'home', teacherOK = false;
function go(fn, ...a) {
  if (cleanup) { try { cleanup(); } catch (e) { } cleanup = null; }
  document.querySelectorAll('.overlay,canvas.confetti').forEach(n => n.remove());
  view.innerHTML = ''; window.scrollTo(0, 0);
  fn(...a); renderTop();
}
function renderTop() {
  document.querySelectorAll('header nav button').forEach(b => b.classList.toggle('on', b.dataset.v === curNav));
  const p = me(); const w = $('#who');
  w.innerHTML = p ? '👤 ' + esc(p.name) + ' · ' + esc(p.klasse) : '👤 Wer bist du?';
}
document.querySelectorAll('header nav button').forEach(b => b.onclick = () => {
  if (b.dataset.v === 'teach') return go(vTeacher);
  if (!me()) return go(vWho);
  go(b.dataset.v === 'home' ? vHome : (LIVE.serverDa === true ? vLiveEntry : vChalLobby));
});
$('#who').onclick = () => go(vWho);

const starsHTML = n => '<span class="stars">' + [1, 2, 3].map(i => i <= n ? '★' : '<span class="off">★</span>').join('') + '</span>';
/* ============ Mini-Spiele ============
   Jedes Mini-Spiel: mg(host, optionen, rng, callback) -> Steuerobjekt g
   callback({progress 0..1, errors, time, completed, ...})   g.stop() beendet vorzeitig, g.kill() ohne Callback */
function base(host, total, o, cb) {
  const g = { done: 0, total, errors: 0, t0: performance.now(), ended: false, cl: [], extra: {} };
  g.ok = () => { g.done++; if (o.h && o.h.ok) o.h.ok(); if (g.done >= g.total) g.finish(true); };
  g.miss = () => {
    g.errors++; if (o.h && o.h.miss) o.h.miss();
    host.classList.remove('miss'); void host.offsetWidth; host.classList.add('miss'); setTimeout(() => host.classList.remove('miss'), 280);
  };
  g.finish = c => {
    if (g.ended) return; g.ended = true; g.cl.forEach(f => f());
    const res = { progress: g.total ? g.done / g.total : 0, errors: g.errors, time: (performance.now() - g.t0) / 1000, completed: !!c };
    cb(Object.assign(res, g.extra));
  };
  g.stop = () => g.finish(false);
  g.kill = () => { if (g.ended) return; g.ended = true; g.cl.forEach(f => f()); };
  g.on = (t, ev, fn, opt) => { t.addEventListener(ev, fn, opt); g.cl.push(() => t.removeEventListener(ev, fn, opt)); };
  g.later = (fn, ms) => { const id = setTimeout(() => { if (!g.ended) fn(); }, ms); g.cl.push(() => clearTimeout(id)); };
  return g;
}

function buildRounds(code) {
  const qs = shuffle(seeded('Q|' + code), QUIZ); let qi = 0;
  return CH.map(d => {
    const rng = seeded(code + '|' + d.id);
    const o = d.mg === 'quiz' ? { q: qs[qi++] } : d.mk(rng);
    return { d, o, rng };
  });
}
function roundScore(res, L) {
  const sp = Math.max(0, 1 - res.time / L);
  if (res.quiz) return res.progress > 0 ? Math.round(1000 * (0.5 + 0.5 * sp)) : 0;
  return Math.max(0, Math.round(1000 * res.progress * (0.4 + 0.6 * sp) - 50 * res.errors));
}

function confetti() {

  const ctx = cv.getContext('2d'), cols = ['#E3A72F', '#C0603A', '#E8906A', '#FBF5F0', '#fff', '#6B1A2A'], t0 = performance.now();
  const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .6, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 8, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6, vr: (Math.random() - .5) * .3 }));

}

    const t0 = performance.now();
    iv = setInterval(() => { const f = (performance.now() - t0) / 1000 / m.L; tb.style.width = Math.max(0, 100 - f * 100) + '%'; if (f >= 1) { clearInterval(iv); if (ctl) ctl.stop(); } }, 50);
    ctl = MG[d.mg](arena, R.o, R.rng, res => {
      clearInterval(iv); ctl = null; tb.style.width = '0%'; submit(res);
      arena.appendChild(el('div', 'banner', `<div class="bi">✅</div><h2>${res.quiz ? 'Antwort abgegeben!' : (res.completed ? 'Geschafft!' : 'Zeit abgelaufen')}</h2><p>Warte auf die anderen …</p>`));
    });
  }
}
function playerReveal(m) {
  curNav = 'chal'; LIVE.screen = 'preveal';
  const mine = m.board.find(b => b.pid === LIVE.pid);
  if (!mine) return playerWait('Warte auf die nächste Runde …');
  LIVE.score = mine.score; LIVE.streak = mine.streak;
  const arena = liveShell(`Runde <b>${m.idx + 1}</b> von ${m.total}`);
  const head = mine.delta > 0 ? (mine.ok ? '👍 Stark!' : '✔ Punkte gesammelt') : '😶 Diesmal keine Punkte';
  arena.appendChild(el('div', 'banner', `<h2>${head}</h2><div class="pts">+${mine.delta}</div>
    <div class="sub">${mine.bonus ? '🔥 Serien-Bonus: +' + mine.bonus + ' · ' : ''}Gesamt: ${mine.score}</div>
    <div class="sub">Platz ${mine.rank} von ${m.board.length}</div><p style="margin-top:16px">${m.last ? 'Das war die letzte Runde – gleich kommt die Siegerehrung!' : 'Warte auf die nächste Runde …'}</p>`));
}
function playerEnd(m) {
  curNav = 'chal'; LIVE.screen = 'pend';
  const mine = m.board.find(b => b.pid === LIVE.pid);
  if (!mine) return playerWait('Das Spiel ist zu Ende.');
  const medal = mine.rank === 1 ? '🥇' : mine.rank === 2 ? '🥈' : mine.rank === 3 ? '🥉' : '🏁';
  const bars = (mine.s || []).map((v, i) => `<i style="height:${Math.max(2, Math.round(v / (CH_MAX[i] || 1000) * 30))}px"></i>`).join('');
  view.innerHTML = `<div class="card center"><div class="big">${medal}</div><h1>Platz ${mine.rank} von ${m.board.length}</h1>
    <p style="font-size:34px;margin:0"><b style="color:var(--tc)">${mine.score}</b> Punkte</p><div class="spark">${bars}</div>
    <p>Danke fürs Mitspielen, ${esc(mine.name)}!</p><div class="row-btns"><button class="btn" id="fin">Fertig</button></div></div>`;
  $('#fin').onclick = () => { liveReset(null); go(vHome); };
}

/* ---------------- Lehrkraft: Beamer-Ansicht ---------------- */
async function vHostLive() {
  curNav = 'teach';
  view.innerHTML = '<div class="card center"><div class="big">📡</div><h1>Live-Spiel</h1><p id="hh">verbinde …</p></div>';
  try {
    if (!(await serverDa())) throw new Error('Diese Seite wurde nicht vom Wettkampfserver geladen.');
    const j = await api('/api/create', {});
    liveReset('host'); Object.assign(LIVE, { pin: j.pin, host: j.host });
    LIVE.url = j.url || apiBase(); LIVE.urlName = j.urlName || '';
    liveStream('pin=' + j.pin + '&host=' + j.host);
    go(hostLobby);
  } catch (e) {
    $('#hh').innerHTML = esc(e.message) + '<br>Starte auf dem Lehrer-Laptop die Datei <b>„Maus-Wettkampf starten.cmd“</b> (oder <code>node maus-server.js</code>).';
  }
}
function hostChips() {
  const pl = $('#pl'), pc = $('#pc'), go_ = $('#gobtn'); if (!pl) return;
  pc.textContent = LIVE.players.length;
  pl.innerHTML = LIVE.players.length ? LIVE.players.map(p => '<span class="pchip">' + esc(p.name) + '</span>').join('') : '<span class="muted">noch niemand …</span>';
  go_.disabled = !LIVE.players.length;
}
async function hostNext(i) {
  const d = CH[i]; if (!d) return;
  try { await api('/api/round', { pin: LIVE.pin, host: LIVE.host, id: d.id, L: d.L, mult: d.mult || 1, total: CH.length }); } catch (e) { toast(e.message); }
}
function hostLobby() {
  curNav = 'teach'; LIVE.screen = 'hlobby';
  view.innerHTML = `<div class="hgrid"><div class="card center"><h2>So spielst du mit</h2>
    <p class="hostbig">1. Öffne im Browser:</p><div class="linkbig">${esc(LIVE.url)}</div>
    ${LIVE.urlName ? `<p class="muted">Oder, falls Rechnernamen im Schulnetz funktionieren: ${esc(LIVE.urlName)}</p>` : ''}
    <p class="hostbig">2. Klicke auf <b>„Challenge“</b>.</p></div>
    <div class="card"><h2>Mitspieler: <span id="pc">0</span></h2><div id="pl" style="min-height:160px"></div>
    <div class="row-btns"><button class="btn tc" id="gobtn" disabled>Challenge starten ▶</button><button class="btn ghost sm" id="stopbtn">Spiel beenden</button></div></div></div>
    <p class="muted">Tipp: F11 schaltet den Vollbildmodus ein.</p>`;
  hostChips();
  $('#gobtn').onclick = () => hostNext(0);
  $('#stopbtn').onclick = () => { if (confirm('Spiel wirklich beenden?')) api('/api/end', { pin: LIVE.pin, host: LIVE.host }).catch(e => toast(e.message)); };
}
function hostRoundView(m) {
  curNav = 'teach'; LIVE.screen = 'hround';
  const d = CH.find(x => x.id === m.id) || CH[m.idx];
  view.innerHTML = `<div class="card center"><div class="muted" style="font-size:26px">Runde ${m.idx + 1} von ${m.total}</div><div class="big">${d.ic}</div><h1>${d.t}</h1>
    <p class="hostbig">${d.text}</p><div class="bigtimer" id="ht2">…</div><p class="hostbig"><b id="hc">0</b> von <b id="ht">${LIVE.players.length}</b> fertig</p>
    <div class="row-btns"><button class="btn ghost" id="evb">Jetzt auswerten</button></div></div>`;
  const base0 = performance.now() - m.el, total = m.intro + m.L * 1000, ht = $('#ht2');
  const iv = setInterval(() => {
    const t = performance.now() - base0;
    if (t < m.intro) { ht.textContent = '3 · 2 · 1'; return; }
    ht.textContent = Math.max(0, Math.ceil((total - t) / 1000)) + ' s';
  }, 200);
  cleanup = () => clearInterval(iv);
  $('#evb').onclick = () => api('/api/reveal', { pin: LIVE.pin, host: LIVE.host }).catch(e => toast(e.message));
}
function hostReveal(m) {
  curNav = 'teach'; LIVE.screen = 'hreveal';
  const d = CH.find(x => x.id === m.id) || CH[m.idx];
  let extra = '';
  if (d.mg === 'quiz') {
    if (!LIVE.rounds) LIVE.rounds = buildRounds(LIVE.pin);
    const R = LIVE.rounds.find(r => r.d.id === d.id);
    if (R && R.o.q) extra = `<p class="hostbig"><b>${esc(R.o.q.q)}</b><br>Richtig war: <b style="color:var(--ok)">${esc(R.o.q.o[0])}</b></p>`;
  }
  const next = CH[m.idx + 1];
  view.innerHTML = `<div class="card"><div class="muted" style="font-size:24px">Runde ${m.idx + 1} von ${m.total} · ${d.t}</div><h1>Rangliste</h1>${extra}
    ${m.board.slice(0, 5).map(b => `<div class="brow"><span class="rk">${b.rank}.</span><span class="nm">${esc(b.name)}</span><span class="dl">${b.delta ? '+' + b.delta : '–'}</span><span class="sc">${b.score}</span></div>`).join('')}
    <p class="muted">${m.board.length} Mitspieler</p>
    <div class="row-btns">${m.last ? '<button class="btn tc" id="nx">Siegerehrung ▶</button>' : `<button class="btn tc" id="nx">Nächste Runde: ${next ? next.t : ''} ▶</button>`}<button class="btn ghost sm" id="stopbtn">Spiel beenden</button></div></div>`;
  $('#nx').onclick = () => m.last ? api('/api/end', { pin: LIVE.pin, host: LIVE.host }).catch(e => toast(e.message)) : hostNext(m.idx + 1);
  $('#stopbtn').onclick = () => { if (confirm('Spiel wirklich beenden?')) api('/api/end', { pin: LIVE.pin, host: LIVE.host }).catch(e => toast(e.message)); };
}
function hostEnd(m) {
  curNav = 'teach'; LIVE.screen = 'hend';
  const csv = '﻿' + [['Platz', 'Name', 'Punkte'].concat(CH.map((d, i) => 'R' + (i + 1) + ' ' + d.t))]
    .concat(m.board.map(b => [b.rank, b.name, b.score].concat(b.s || []))).map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  view.innerHTML = `<div class="card center"><div class="big">🏆</div><h1>Endstand</h1>
    <div class="row-btns"><button class="btn tc" id="pod">🏆 Siegerehrung</button><button class="btn ghost" id="csv">💾 Rangliste als Datei</button><button class="btn ghost" id="new">Neues Spiel</button></div></div>
    <div class="card"><table class="rank"><tr><th>Platz</th><th>Name</th><th>Runden</th><th class="num">Punkte</th></tr>
    ${m.board.map(b => `<tr><td>${b.rank}.</td><td>${esc(b.name)}</td><td><span class="spark">${(b.s || []).map((v, i) => `<i style="height:${Math.max(2, Math.round(v / (CH_MAX[i] || 1000) * 28))}px"></i>`).join('')}</span></td><td class="num">${b.score}</td></tr>`).join('')}</table></div>`;
  $('#pod').onclick = () => podium(m.board.map(b => ({ n: b.name, k: '', t: b.score, rank: b.rank })));
  $('#csv').onclick = () => download('maus-wettkampf_' + LIVE.pin + '.csv', csv, 'text/csv;charset=utf-8');
  $('#new').onclick = () => go(vHostLive);
}
go(me() ? vHome : vWho);
</script>
</body>
</html>
